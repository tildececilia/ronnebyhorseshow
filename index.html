<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tävlingssektionen</title>
<style>
  :root {
    /* Ronneby Ryttarförening: loggans blå (#0047b5), svart och vitt, gult ur rrf.nu som accent */
    --bg: #f3f5f9;
    --bg2: #e7ebf3;
    --card: #ffffff;
    --border: #d4dae6;
    --text: #141a2b;
    --muted: #68718a;
    --accent: #0047b5;
    --accent-soft: rgba(0, 71, 181, .10);
    --navy: #0a1836;
    --navy2: #122554;
    --yellow: #f0dc3c;
    --green: #3f7d4e;
    --green-soft: rgba(63, 125, 78, .12);
    --warn: #c4871b;
    --warn-soft: rgba(196, 135, 27, .14);
    --danger: #b3382e;
    --radius: 10px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  .app { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; } .side { position: static !important; height: auto !important; } }

  .side { background: var(--navy); color: #fff; padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; margin: 2px 4px 16px; }
  .brand img { width: 54px; height: 54px; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  .brand .t { font-weight: 700; font-size: 16px; line-height: 1.15; letter-spacing: .2px; }
  .brand .t small { display: block; font-weight: 500; color: var(--yellow); font-size: 12px; margin-top: 3px; letter-spacing: .04em; text-transform: uppercase; }
  .brand .t .dagar { display: block; font-weight: 400; color: rgba(255,255,255,.55); font-size: 11px; margin-top: 3px; text-transform: none; letter-spacing: 0; }
  .nav button { display: flex; width: 100%; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 8px; color: rgba(255,255,255,.85); gap: 8px; align-items: center; }
  .nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav button.active { background: rgba(255,255,255,.16); color: #fff; font-weight: 600; box-shadow: inset 3px 0 0 var(--yellow); }
  .nav .count { margin-left: auto; color: rgba(255,255,255,.5); font-size: 12px; }
  .nav h4 { margin: 18px 10px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.5); font-weight: 600; }
  .nav .sub button { padding-left: 26px; font-size: 14px; }
  .nav .sub button.kat { padding-left: 10px; font-weight: 600; font-size: 15px; }
  .nav .sub .pil { width: 12px; color: rgba(255,255,255,.5); font-size: 12px; display: inline-block; }
  .nav .sub.oppen { background: rgba(255,255,255,.04); border-radius: 8px; padding-bottom: 4px; margin-bottom: 2px; }
  .nav button.laggtill { color: var(--yellow); font-weight: 600; margin-top: 6px; font-size: 14px; }
  .nav button.laggtill:hover { background: rgba(240,220,60,.12); }
  .nav .plus { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--yellow); align-items: center; justify-content: center; font-size: 15px; line-height: 1; }
  .printhead { display: none; }

  .main { padding: 28px 36px 60px; max-width: 1200px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 26px; }
  .topbar h1::after { content: ''; display: block; width: 44px; height: 4px; background: var(--yellow); border-radius: 2px; margin-top: 6px; }
  .topbar .sub { color: var(--muted); margin-top: 2px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .btn { border: 1px solid var(--border); background: var(--card); padding: 7px 13px; border-radius: 8px; color: var(--text); }
  .btn:hover { background: var(--bg2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(.95); background: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.small { padding: 4px 9px; font-size: 13px; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: rgba(0,0,0,.05); color: var(--text); }
  .iconbtn { border: 0; background: transparent; color: var(--muted); padding: 2px 6px; border-radius: 6px; font-size: 14px; line-height: 1; }
  .iconbtn:hover { background: rgba(0,0,0,.06); color: var(--text); }
  .iconbtn.danger:hover { color: var(--danger); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .card.click { cursor: pointer; transition: border-color .1s, transform .1s; }
  .card.click:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card h3 { margin: 0 0 4px; font-size: 17px; }
  .card .desc { color: var(--muted); font-size: 14px; min-height: 1.4em; }
  .card .meta { display: flex; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .progress { height: 5px; background: var(--bg2); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--green); }

  .section-head { display: flex; align-items: baseline; gap: 12px; margin: 26px 0 10px; }
  .section-head:first-child { margin-top: 0; }
  .section-head h2 { margin: 0; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .section-head .line { flex: 1; height: 1px; background: var(--border); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--bg2); font-size: 13px; border: 1px solid transparent; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip.pick { cursor: pointer; }
  .chip.pick:hover { border-color: var(--border); }
  .chip .x { cursor: pointer; opacity: .6; } .chip .x:hover { opacity: 1; }
  .avatar { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 11px; align-items: center; justify-content: center; flex: none; }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 1000px) { .two { grid-template-columns: 1fr; } }
  .block { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 18px; }
  .block > h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  .block > h2 .right { margin-left: auto; display: flex; gap: 6px; }
  .empty { color: var(--muted); font-style: italic; padding: 6px 0; font-size: 14px; }

  .task { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--border); }
  .task:first-of-type { border-top: 0; }
  .task input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--green); }
  .task .t { }
  .task.done .t .txt { text-decoration: line-through; color: var(--muted); }
  .task .txt { cursor: pointer; border-radius: 4px; margin: -2px -4px; padding: 2px 4px; }
  .task .txt:hover { background: var(--accent-soft); }
  .task .note { font-size: 13px; color: var(--muted); white-space: pre-wrap; margin: 4px 0 2px; padding-left: 8px; border-left: 2px solid var(--border); cursor: pointer; }
  .task .who { font-size: 13px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .task .who .chip { padding: 1px 8px; font-size: 12px; }
  .filrad { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .filrad:first-of-type { border-top: 0; }
  .filrad a { text-decoration: none; font-weight: 600; }
  .filrad a:hover { text-decoration: underline; }
  .filrad .hint { margin-left: auto; white-space: nowrap; }
  .filrad .iconbtn { opacity: .35; } .filrad:hover .iconbtn { opacity: 1; }
  .task .who select { border: 0; background: transparent; color: var(--muted); padding: 0; font-size: 13px; cursor: pointer; }
  .task .who select:hover { color: var(--text); }
  .task .ops { display: flex; gap: 2px; opacity: .25; transition: opacity .1s; }
  .task:hover .ops { opacity: 1; }
  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow input { flex: 1; }

  input[type=text], input[type=time], input[type=tel], textarea, select { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; background: #fff; width: 100%; }
  textarea { resize: vertical; min-height: 70px; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label.f:first-child { margin-top: 0; }
  .daypick { display: flex; gap: 6px; flex-wrap: wrap; }

  dialog { border: 1px solid var(--border); border-radius: 14px; padding: 0; width: min(560px, 94vw); box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  dialog.stor { width: min(960px, 96vw); max-height: 94vh; }
  dialog.stor form { display: flex; flex-direction: column; max-height: 94vh; }
  dialog.stor .vax { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  dialog.stor textarea.stor { flex: 1; min-height: 55vh; font-size: 15px; line-height: 1.5; padding: 12px 14px; }
  .task .note ul { margin: 2px 0; padding-left: 18px; }
  .task .note li { margin: 1px 0; }
  dialog::backdrop { background: rgba(40,30,20,.35); }
  dialog form { padding: 22px 24px; }
  dialog h2 { margin: 0 0 14px; font-size: 19px; }
  dialog .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 20px; }
  dialog .foot .r { display: flex; gap: 8px; margin-left: auto; }

  .schema { border: 1px solid var(--border); border-radius: var(--radius); margin-top: 12px; overflow: hidden; }
  .schema .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg2); }
  .schema .head h3 { margin: 0; font-size: 15px; }
  .schema .head .days { color: var(--muted); font-size: 13px; }
  .schema .head .right { margin-left: auto; display: flex; gap: 4px; }
  .daycols { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .daycol { border-right: 1px solid var(--border); padding: 10px 12px; min-height: 90px; }
  .daycol:last-child { border-right: 0; }
  .daycol h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .pass { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; margin-bottom: 6px; font-size: 13px; cursor: pointer; position: relative; }
  .pass:hover { border-color: var(--accent); }
  .pass .time { font-weight: 600; }
  .pass .ppl { color: var(--text); margin-top: 2px; }
  .pass .ppl.none { color: var(--warn); }
  .pass .note { color: var(--muted); margin-top: 2px; }
  .pass.conflict { border-color: var(--warn); background: var(--warn-soft); }
  .pass .omr { color: var(--muted); font-size: 12px; }
  .pass .dup { color: var(--warn); font-size: 12px; margin-top: 2px; }
  .addpass { width: 100%; border: 1px dashed var(--border); background: transparent; color: var(--muted); border-radius: 8px; padding: 6px; font-size: 13px; }
  .addpass:hover { border-color: var(--accent); color: var(--accent); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button { border: 0; background: transparent; padding: 9px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); }
  .tabs button.active { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  tr:hover td { background: rgba(0,0,0,.015); }
  td .ops { opacity: .3; } tr:hover td .ops { opacity: 1; }

  .badge { display: inline-flex; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #d7263d; color: #fff; font-size: 12px; font-weight: 700; align-items: center; justify-content: center; line-height: 1; margin-left: 6px; }
  .nav .badge { margin-left: auto; }
  .nav .badge + .count { margin-left: 8px; }
  .anslagknapp { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 22px; font-size: 16px; font-weight: 600; }
  .anslagknapp:hover { border-color: var(--accent); }
  .anslagknapp .sub { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 4px; }
  .anslagknapp .badge { font-size: 13px; height: 22px; min-width: 22px; }
  .anslagknapp .pil { margin-left: auto; color: var(--muted); }
  .anslag { padding: 22px 24px; max-height: 94vh; overflow: auto; }
  .anslag .ahead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .anslag .ahead h2 { margin: 0; flex: 1; }
  .anslag .nytt { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px; }
  .anslag .nytt textarea { min-height: 90px; margin-top: 8px; }
  .anslag .nytt .rad { display: flex; justify-content: flex-end; margin-top: 8px; }
  .inlagg { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; background: var(--card); }
  .inlagg.ny { border-color: #d7263d; box-shadow: inset 3px 0 0 #d7263d; }
  .inlagg .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .inlagg .top b { font-size: 15px; }
  .inlagg .top .tid { color: var(--muted); font-size: 13px; }
  .inlagg .top .ops { margin-left: auto; opacity: .35; } .inlagg:hover .top .ops { opacity: 1; }
  .inlagg h3 { margin: 4px 0 6px; font-size: 16px; }
  .inlagg .text { white-space: pre-wrap; line-height: 1.5; }
  .inlagg .text ul { margin: 2px 0; padding-left: 18px; }
  .komm { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 14px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
  .komm .top { margin-bottom: 2px; }
  .komm .text { white-space: pre-wrap; }
  .komm.ny .text::before { content: 'Ny'; display: inline-block; background: #d7263d; color: #fff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 8px; margin-right: 6px; vertical-align: 1px; }
  .kommrad { display: flex; gap: 8px; margin-top: 12px; }
  .kommrad input { flex: 1; }
  .status { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: #d7263d; color: #fff; text-align: center; padding: 6px 12px; font-size: 13px; display: none; }
  .status.show { display: block; }
  .status.lokal { background: var(--warn); }
  .laddar { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 40; color: var(--muted); font-size: 15px; gap: 10px; }
  .klasstabell th, .klasstabell td { padding: 7px 9px; font-size: 13px; }
  .bantabell th, .bantabell td { padding: 8px 8px; vertical-align: middle; font-size: 14px; }
  .bantabell td.nr { color: var(--muted); font-size: 12px; width: 28px; }
  .bantabell tr.ombyggnad td { background: var(--warn-soft); }
  .bantabell tr.ombyggnad td:first-child { border-left: 3px solid var(--warn); }
  .bantabell tr.annat td { background: var(--bg2); }
  .bantabell .klass { font-weight: 600; }
  .bantabell .klass small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .bantabell select { padding: 5px 8px; font-size: 13px; min-width: 120px; }
  .bantabell select.tom { color: var(--warn); border-color: var(--warn); }
  .bantabell .chips { gap: 4px; }
  .bantabell .chips .chip { padding: 1px 8px; font-size: 12px; }
  .bantabell .chips select { width: auto; min-width: 0; padding: 2px 6px; font-size: 12px; border-radius: 999px; }
  .bantabell .ops { white-space: nowrap; opacity: .3; } .bantabell tr:hover .ops { opacity: 1; }
  .bantabell .note { font-size: 12px; color: var(--muted); display: block; }
  @media print { .bantabell select { border: 0; background: transparent; appearance: none; padding: 0; min-width: 0; } .bantabell .chips select, .bantabell .ops { display: none; } }
  .stallchips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .stallchips .chip { cursor: pointer; padding: 6px 14px; font-size: 14px; }
  .stallchips .chip:hover { border-color: var(--border); }
  .stallkarta { display: grid; grid-template-columns: 1fr 56px 1fr; gap: 0 10px; align-items: start; }
  .stallkarta .kol { display: flex; flex-direction: column; gap: 6px; }
  .stallkarta .gang { background: repeating-linear-gradient(0deg, var(--bg2) 0 14px, transparent 14px 20px); border-left: 2px dashed var(--border); border-right: 2px dashed var(--border); align-self: stretch; display: flex; align-items: center; justify-content: center; }
  .stallkarta .gang span { writing-mode: vertical-rl; color: var(--muted); font-size: 12px; letter-spacing: .15em; text-transform: uppercase; background: var(--card); padding: 8px 2px; }
  .box { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; background: var(--card); cursor: pointer; position: relative; min-height: 58px; }
  .box:hover { border-color: var(--accent); }
  .box.ledig { background: var(--bg); color: var(--muted); border-style: dashed; }
  .box .nr { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .box .nr b { color: var(--text); font-size: 14px; }
  .box .hast { font-weight: 600; margin-top: 1px; }
  .box .ryt { font-size: 13px; color: var(--muted); }
  .box .bet { position: absolute; right: 8px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
  .box .bet.ej { background: transparent; border: 1.5px solid var(--warn); }
  .box .ops { position: absolute; right: 6px; bottom: 4px; display: flex; gap: 0; opacity: 0; }
  .box:hover .ops { opacity: 1; }
  .box .ops .iconbtn { padding: 0 4px; font-size: 12px; }
  .stallsum { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
  .stallsum b { color: var(--text); }
  .soklista .rad { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--border); cursor: pointer; }
  .soklista .rad:hover { background: rgba(0,0,0,.02); }
  .soklista .rad:first-child { border-top: 0; }
  @media (max-width: 700px) { .stallkarta { grid-template-columns: 1fr 30px 1fr; } }
  .klasstabell td:last-child { width: 70px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .hint { color: var(--muted); font-size: 13px; }
  .vem { margin: 0 8px 14px; font-size: 13px; color: rgba(255,255,255,.6); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .vem b { color: #fff; }
  .vem button { border: 0; background: none; color: var(--yellow); padding: 0; font-size: 13px; }
  .logg { font-size: 13px; }
  .logg .dag { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 12px 0 4px; }
  .logg .dag:first-child { margin-top: 0; }
  .logg .rad { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 5px 0; border-top: 1px solid var(--border); }
  .logg .rad .tid { color: var(--muted); font-variant-numeric: tabular-nums; }
  .logg .rad .vemn { font-weight: 600; }
  .logg .rad .var { color: var(--muted); }
  .logg .rad .var a { color: var(--muted); }
  .warnbox { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }

  @media print {
    .printhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--navy); }
    .printhead img { width: 44px; height: 44px; }
    .printhead b { font-size: 16px; } .printhead span { color: var(--muted); font-size: 13px; }
    .side, .topbar .actions, .tabs, .addpass, .iconbtn, .btn { display: none !important; }
    .app { display: block; }
    .main { padding: 0; max-width: none; }
    body { background: #fff; }
    .pass { cursor: default; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }

function seedData() {
  const P = {};

  const personer = [
    person('Tilda'), person('Emmy'), person('Pian'), person('Micke M'),
    person('Camilla', 'Frågetecken i Excel-filen, inte bekräftad'), person('Stefan'),
  ];
  const sekt = (namn) => ({ id: uid(), namn });
  const S = {
    bana: sekt('Tävlingsbanan'), fram: sekt('Framhoppning'), teknik: sekt('Teknik'),
    upp: sekt('Uppstallade'), park: sekt('Parkering'), domar: sekt('Domartornet'), mat: sekt('Mat'),

function mergeInPlace(mal, kalla) {
  if (Array.isArray(kalla)) {
    if (!Array.isArray(mal)) return kalla;
    const medId = kalla.every(x => x && typeof x === 'object' && x.id != null);
    if (!medId) { mal.length = 0; mal.push(...kalla); return mal; }
    const gamla = new Map(mal.filter(x => x && x.id != null).map(x => [x.id, x]));
    const nya = kalla.map(x => { const g = gamla.get(x.id); return g ? mergeInPlace(g, x) : x; });
    mal.length = 0; mal.push(...nya); return mal;
  }
  if (kalla && typeof kalla === 'object') {
    if (!mal || typeof mal !== 'object' || Array.isArray(mal)) return kalla;
    for (const k of Object.keys(mal)) if (!(k in kalla)) delete mal[k];
    for (const k of Object.keys(kalla)) mal[k] = mergeInPlace(mal[k], kalla[k]);
    return mal;
  }
  return kalla;
}

  if (r.view === 'uppstallning') return stallKategori()?.id || null;
  if (r.view === 'banschema') return banaKategori()?.id || null;
  return null;
}
function go(view, params = {}) { route = { view, ...params }; const k = katForRoute(route); if (k) oppenKat = k; render(); window.scrollTo(0, 0); }
function klickKategori(id) { oppenKat = id; go('sektion', { id }); }

/* ============ Navigering ============ */
function renderNav() {
  const r = route;
  const act = (v, extra) => (r.view === v && (!extra || Object.entries(extra).every(([k, val]) => r[k] === val))) ? 'active' : '';
  let h = `
    <button class="${act('oversikt')}" onclick="go('oversikt')">🏠 Översikt ${anslagBadge()}</button>
    <button class="${act('schema')}" onclick="go('schema')">📅 Schema <span class="count">${allaPass().length}</span></button>
    <button class="${act('klasser')}" onclick="go('klasser')">🏇 Klasser <span class="count">${(state.klasser || []).length}</span></button>
    ${stallKategori() ? '' : `<button class="${act('uppstallning')}" onclick="go('uppstallning')">🐴 Uppstallning <span class="count">${(state.boxar || []).length}</span></button>`}
    ${banaKategori() ? '' : `<button class="${act('banschema')}" onclick="go('banschema')">🏇 Banschema <span class="count">${(state.banrader || []).length}</span></button>`}
    <button class="${act('personer')}" onclick="go('personer')">👥 Personer <span class="count">${state.personer.length}</span></button>
    <h4>Kategorier</h4>`;
  for (const s of state.sektioner) {
    const os = omradenI(s.id); const oppen = oppenKat === s.id;
    h += `<div class="sub ${oppen ? 'oppen' : ''}">`;
    h += `<button class="kat ${act('sektion', { id: s.id })}" onclick="klickKategori('${s.id}')"><span class="pil">${oppen ? '▾' : '▸'}</span>${esc(s.namn)}<span class="count">${os.length + (s.stall ? 1 : 0) + (s.bana ? 1 : 0)}</span></button>`;
    if (oppen) {
      if (s.bana) h += `<button class="${act('banschema')}" onclick="go('banschema')">🏇 Banschema <span class="count">${(state.banrader || []).length}</span></button>`;
      if (s.stall) h += `<button class="${act('uppstallning')}" onclick="go('uppstallning')">🐴 Stall och boxar <span class="count">${(state.boxar || []).length}</span></button>`;
      for (const o of os) h += `<button class="${act('omrade', { id: o.id })}" onclick="go('omrade',{id:'${o.id}'})">${esc(o.namn)}</button>`;
      if (!os.length && !s.stall && !s.bana) h += `<div class="hint" style="padding:4px 22px 8px">Inga områden ännu</div>`;
    }
    h += `</div>`;
  }
  h += `<button class="laggtill" onclick="dlgSektion()" title="Ny kategori"><span class="plus">+</span> Lägg till kategori</button>`;
  h += `<h4>Mer</h4><button class="${act('installningar')}" onclick="go('installningar')">⚙️ Inställningar</button>`;
  document.getElementById('nav').innerHTML = h;
  document.getElementById('brandNamn').textContent = state.tavling.namn;
  document.getElementById('brandVecka').textContent = state.tavling.vecka || '';
  document.getElementById('printNamn').textContent = state.tavling.namn + (state.tavling.vecka ? ' · ' + state.tavling.vecka : '');
  document.getElementById('brandSub').textContent = dagarValda().map(d => d.kort).join(', ');
  document.title = state.tavling.namn + ' · Tävlingssektionen';
  document.getElementById('vemRad').innerHTML = vem ? `Du är <b>${esc(vem)}</b> <button onclick="dlgVem()">byt</button>` : `<button onclick="dlgVem()">Vem är du? Välj namn</button>`;
}

/* ============ Vyer ============ */
function render() {
  renderNav();
  const m = document.getElementById('main');
  const v = route.view;
  if (v === 'oversikt') m.innerHTML = vyOversikt();
  else if (v === 'sektion') m.innerHTML = vySektion(route.id);
  else if (v === 'omrade') m.innerHTML = vyOmrade(route.id);
  else if (v === 'schema') m.innerHTML = vySchema();
  else if (v === 'personer') m.innerHTML = vyPersoner();
  else if (v === 'klasser') m.innerHTML = vyKlasser();
  else if (v === 'uppstallning') m.innerHTML = vyUppstallning();
  else if (v === 'banschema') m.innerHTML = vyBanschema();
  else if (v === 'installningar') m.innerHTML = vyInstallningar();
}

function omradeKort(o) {
  const klar = o.uppgifter.filter(u => u.klar).length, tot = o.uppgifter.length;
  const pass = o.scheman.reduce((n, s) => n + s.pass.length, 0);
  return `<div class="card click" onclick="go('omrade',{id:'${o.id}'})">
    <h3>${esc(o.namn)}</h3>
    <div class="desc">${esc(o.beskrivning) || '<span style="opacity:.6">Ingen beskrivning</span>'}</div>
    <div class="chips" style="margin-top:10px">${o.ansvariga.length ? o.ansvariga.map(p => avatarChip(p)).join('') : '<span class="hint">Ingen ansvarig</span>'}</div>
    <div class="meta"><span>✓ ${klar} / ${tot} uppgifter</span><span>📅 ${o.scheman.length} schema, ${pass} pass</span></div>
    ${tot ? `<div class="progress"><i style="width:${Math.round(klar / tot * 100)}%"></i></div>` : ''}
  </div>`;
}

function vyOversikt() {
  const totU = state.omraden.reduce((n, o) => n + o.uppgifter.length, 0);
  const klarU = state.omraden.reduce((n, o) => n + o.uppgifter.filter(u => u.klar).length, 0);
  const utanAnsv = state.omraden.filter(o => !o.ansvariga.length).length;
  let h = `<div class="topbar"><div><h1>${esc(state.tavling.namn)}${state.tavling.vecka ? ` <span style="font-weight:400;color:var(--muted);font-size:20px">${esc(state.tavling.vecka)}</span>` : ''}</h1>
    <div class="sub">${state.sektioner.length} kategorier · ${state.omraden.length} områden · ${klarU} av ${totU} uppgifter klara${utanAnsv ? ` · ${utanAnsv} områden utan ansvarig` : ''}</div></div>
    <div class="actions"><button class="btn" onclick="dlgSektion()">+ Ny kategori</button><button class="btn primary" onclick="dlgOmrade()">+ Nytt område</button></div></div>`;
  const nya = anslagNya(), antal = (state.anslag || []).length;
  h += `<button class="anslagknapp" onclick="dlgAnslag()">📌 Anslagstavla${nya ? `<span class="badge">${nya}</span>` : ''}<span class="sub">${antal ? `${antal} inlägg` : 'Inga inlägg ännu'}${nya ? ` · ${nya} ${nya === 1 ? 'nytt du inte sett' : 'nya du inte sett'}` : ''}</span><span class="pil">Öppna ›</span></button>`;
  for (const s of state.sektioner) {
    const os = omradenI(s.id);
    h += `<div class="section-head"><h2>${esc(s.namn)}</h2><div class="line"></div>
      <button class="iconbtn" title="Byt namn" onclick="dlgSektion('${s.id}')">✎</button>
      <button class="iconbtn" title="Nytt område i kategorin" onclick="dlgOmrade(null,'${s.id}')">+</button>
      <button class="iconbtn danger" title="Ta bort kategori" onclick="taBortSektion('${s.id}')">🗑</button></div>`;
    h += `<div class="grid">${os.map(omradeKort).join('') || '<div class="empty">Inga områden i den här kategorin ännu.</div>'}</div>`;
  }
  return h;
}

/* ============ Filer (Supabase Storage, lagringsytan "filer") ============ */
const FIL_BUCKET = 'filer', FIL_MAX = 50 * 1024 * 1024;
const filUrl = path => sb ? sb.storage.from(FIL_BUCKET).getPublicUrl(path).data.publicUrl : '#';
const storlekText = n => n >= 1048576 ? (n / 1048576).toFixed(1).replace('.', ',') + ' MB' : n >= 1024 ? Math.round(n / 1024) + ' kB' : n + ' B';
const filAgare = (typ, id) => typ === 'kategori' ? sektById(id) : omrById(id);
function loggaFil(typ, agare, text) {
  if (typ === 'omrade') return logga(agare.id, text);
  state.logg ||= []; state.logg.push({ id: uid(), tid: new Date().toISOString(), vem: vem || 'Okänd', kategoriId: agare.id, omradeId: null, omrade: '', text: `${text} på kategorin ${agare.namn}` });
}
function filerBlock(typ, agare) {
  const filer = agare.filer || [];
  return `<div class="block"><h2>Filer <span class="hint" style="font-weight:400">${filer.length ? `${filer.length} ${filer.length === 1 ? 'fil' : 'filer'}` : ''}</span>
      <span class="right">${sb ? `<label class="btn small" style="cursor:pointer">+ Lägg till fil<input type="file" style="display:none" onchange="laddaUppFil('${typ}','${agare.id}',this)"></label>` : ''}</span></h2>
    ${filer.map(f => `<div class="filrad"><a href="${esc(filUrl(f.path))}" target="_blank" rel="noopener">📎 ${esc(f.namn)}</a><span class="hint">${storlekText(f.storlek || 0)} · ${esc(f.vem)} · ${esc(tidStr(f.tid))}</span><button class="iconbtn danger" title="Ta bort filen" onclick="taBortFil('${typ}','${agare.id}','${f.id}')">🗑</button></div>`).join('')
      || `<div class="empty">Inga filer ännu. Bifoga kartor, listor, bilder eller avtal.${sb ? '' : ' Filer kan bara laddas upp på den publika sidan.'}</div>`}</div>`;
}
async function laddaUppFil(typ, id, input) {
  const fil = input.files[0]; input.value = ''; if (!fil) return;
  if (!sb) return alert('Filer kan bara laddas upp på den publika sidan som är kopplad till databasen.');
  if (fil.size > FIL_MAX) return alert('Filen är för stor. Max 50 MB per fil.');
  const agare = filAgare(typ, id); if (!agare) return;
  const safe = fil.name.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80);
  const path = `${typ}/${id}/${uid()}-${safe}`;
  toast('Laddar upp…');
  const { error } = await sb.storage.from(FIL_BUCKET).upload(path, fil, { contentType: fil.type || 'application/octet-stream', upsert: false });
  if (error) return alert(`Uppladdningen misslyckades: ${error.message}\n\nÄr lagringsytan "filer" skapad i Supabase? Se Tävlingssektionen-filer.sql.`);
  agare.filer ||= []; agare.filer.push({ id: uid(), namn: fil.name, path, storlek: fil.size, typ: fil.type || '', tid: new Date().toISOString(), vem: vem || 'Okänd' });
  loggaFil(typ, agare, `bifogade filen "${fil.name}"`);
  save(); render();
}
async function taBortFil(typ, id, fid) {
  const agare = filAgare(typ, id); const f = (agare.filer || []).find(x => x.id === fid); if (!f) return;
  if (!confirm(`Ta bort filen "${f.namn}"?`)) return;
  agare.filer = agare.filer.filter(x => x.id !== fid); loggaFil(typ, agare, `tog bort filen "${f.namn}"`); save(); render();
  if (sb) { const { error } = await sb.storage.from(FIL_BUCKET).remove([f.path]); if (error) console.warn('Kunde inte ta bort filen i lagringen', error); }
}

  return `<div class="topbar"><div><h1>${esc(s.namn)}</h1><div class="sub">Kategori · ${os.length} områden</div></div>
    <div class="actions"><button class="btn" onclick="dlgSektion('${s.id}')">Byt namn</button><button class="btn primary" onclick="dlgOmrade(null,'${s.id}')">+ Nytt område</button></div></div>
    <div class="grid">${s.bana ? `<div class="card click" onclick="go('banschema')"><h3>🏇 Banschema</h3><div class="desc">Klass för klass: banchef, insläpp, utsläpp och banpersonal, med ombyggnad emellan.</div>
      <div class="meta"><span>${(state.banrader || []).filter(r => r.typ === 'klass').length} klasser</span><span>${(state.banrader || []).filter(r => r.typ === 'ombyggnad').length} ombyggnader</span><span>${banObemannade()} roller saknar person</span></div></div>` : ''}${s.stall ? `<div class="card click" onclick="go('uppstallning')"><h3>🐴 Stall och boxar</h3><div class="desc">Vilka som står var: kartor och listor per stall, med ryttare, häst, avgift och betalt.</div>
      <div class="meta"><span>${(state.stall || []).length} stall</span><span>${(state.boxar || []).length} boxar</span><span>${(state.boxar || []).filter(boxBelagd).length} belagda</span><span>${(state.boxar || []).filter(b => boxBelagd(b) && b.betalt).length} betalda</span></div></div>` : ''}${os.map(omradeKort).join('') || (s.stall || s.bana ? '' : '<div class="empty">Inga områden ännu.</div>')}</div>
    <div style="margin-top:24px">${filerBlock('kategori', s)}</div>
    <div class="block"><h2>Ändringslogg <span class="hint" style="font-weight:400">allt som gjorts i kategorin, och av vem</span></h2>
      ${loggLista((state.logg || []).filter(r => r.kategoriId === id), 'k' + id, true)}</div>`;
}

          <option value="__ny">＋ Ny person…</option>

      <form class="addrow" onsubmit="event.preventDefault(); laggTillUppgift('${o.id}', this.txt.value); this.txt.value='';">

      ${o.scheman.map(sc => schemaBlock(o, sc)).join('') || '<div class="empty" style="margin-top:8px">Inget schema ännu. Skapa ett och välj vilka dagar det gäller.</div>'}
    </div>
    ${filerBlock('omrade', o)}
    <div class="block"><h2>Ändringslogg</h2>${loggLista((state.logg || []).filter(r => r.omradeId === o.id), 'o' + o.id, false)}</div>
  </div></div>`;
  return h;

/* ============ Anslagstavla ============ */
const SETT_KEY = () => 'tavlingssektionen.sett.' + (vem || 'okand');
function settTid() { try { return localStorage.getItem(SETT_KEY()) || ''; } catch { return ''; } }
function arNy(x, sedan) { return x.vem !== (vem || 'Okänd') && x.tid > sedan; }
function anslagNya() {
  const t = settTid(); let n = 0;
  for (const a of (state.anslag || [])) { if (arNy(a, t)) n++; for (const k of a.kommentarer) if (arNy(k, t)) n++; }
  return n;
}
function anslagBadge() { const n = anslagNya(); return n ? `<span class="badge" title="${n} nya på anslagstavlan">${n}</span>` : ''; }
function tidStr(iso) { const d = new Date(iso); return d.toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + d.toTimeString().slice(0, 5); }
let anslagSedan = '';
function dlgAnslag() {
  anslagSedan = settTid();
  dlg.classList.add('stor');
  dlg.innerHTML = `<div class="anslag"><div class="ahead"><h2>📌 Anslagstavla</h2><button class="btn" onclick="dlg.close()">Stäng</button></div><div id="anslagInner"></div></div>`;
  renderAnslag();
  dlg.showModal();
  try { localStorage.setItem(SETT_KEY(), new Date().toISOString()); } catch {}
  render();
}
function renderAnslag() {
  const poster = [...(state.anslag || [])].sort((a, b) => b.tid.localeCompare(a.tid));
  let h = `<div class="nytt"><input type="text" id="anslagRubrik" placeholder="Rubrik (valfritt)">
    <textarea id="anslagText" placeholder="Skriv ett inlägg till alla i tävlingssektionen… Rader som börjar med - blir punktlista."></textarea>
    <div class="rad"><button class="btn primary" onclick="nyttAnslag()">Anslå</button></div></div>`;
  if (!poster.length) h += '<div class="empty">Inga inlägg ännu. Skriv det första!</div>';
  for (const a of poster) {
    h += `<div class="inlagg ${arNy(a, anslagSedan) ? 'ny' : ''}" id="inlagg-${a.id}">
      <div class="top"><span class="avatar">${esc(initialer(a.vem))}</span><b>${esc(a.vem)}</b><span class="tid">${esc(tidStr(a.tid))}</span>${arNy(a, anslagSedan) ? '<span class="badge">Ny</span>' : ''}
        <span class="ops"><button class="iconbtn danger" title="Ta bort inlägget" onclick="taBortAnslag('${a.id}')">🗑</button></span></div>
      ${a.rubrik ? `<h3>${esc(a.rubrik)}</h3>` : ''}
      <div class="text">${anteckningHtml(a.text)}</div>
      ${a.kommentarer.map(k => `<div class="komm ${arNy(k, anslagSedan) ? 'ny' : ''}"><span class="avatar">${esc(initialer(k.vem))}</span><div><div class="top"><b>${esc(k.vem)}</b> <span class="tid">${esc(tidStr(k.tid))}</span><span class="ops"><button class="iconbtn danger" title="Ta bort kommentaren" onclick="taBortKommentar('${a.id}','${k.id}')">🗑</button></span></div><div class="text">${esc(k.text)}</div></div></div>`).join('')}
      <div class="kommrad"><input type="text" id="komm-${a.id}" placeholder="Skriv en kommentar…" onkeydown="if(event.key==='Enter'){event.preventDefault();nyKommentar('${a.id}')}"><button class="btn small" onclick="nyKommentar('${a.id}')">Kommentera</button></div>
    </div>`;
  }
  document.getElementById('anslagInner').innerHTML = h;
}
function nyttAnslag() {
  const rubrik = document.getElementById('anslagRubrik').value.trim(), text = document.getElementById('anslagText').value.trim();
  if (!text && !rubrik) { toast('Skriv något först'); return; }
  state.anslag ||= [];
  state.anslag.push({ id: uid(), tid: new Date().toISOString(), vem: vem || 'Okänd', rubrik, text, kommentarer: [] });
  save(); renderAnslag(); render();
}
function nyKommentar(aid) {
  const inp = document.getElementById('komm-' + aid); const text = inp.value.trim(); if (!text) return;
  const a = state.anslag.find(a => a.id === aid); a.kommentarer.push({ id: uid(), tid: new Date().toISOString(), vem: vem || 'Okänd', text });
  save(); renderAnslag(); render();
  document.getElementById('inlagg-' + aid)?.scrollIntoView({ block: 'nearest' });
}
function taBortAnslag(aid) {
  const a = state.anslag.find(a => a.id === aid);
  if (!confirm(`Ta bort inlägget${a.rubrik ? ` "${a.rubrik}"` : ''} av ${a.vem}${a.kommentarer.length ? ` med ${a.kommentarer.length} kommentarer` : ''}?`)) return;
  state.anslag = state.anslag.filter(x => x.id !== aid); save(); renderAnslag(); render();
}
function taBortKommentar(aid, kid) {
  const a = state.anslag.find(a => a.id === aid); const k = a.kommentarer.find(k => k.id === kid);
  if (!confirm(`Ta bort kommentaren av ${k.vem}?`)) return;
  a.kommentarer = a.kommentarer.filter(x => x.id !== kid); save(); renderAnslag(); render();
}

function anteckningHtml(text) {
  // Rader som börjar med - * eller • blir punktlista, resten visas som den skrevs.
  const ut = []; let lista = null;
  for (const rad of String(text).split('\n')) {
    const m = rad.match(/^\s*[-*•]\s+(.*)$/);
    if (m) { if (!lista) { lista = []; ut.push(lista); } lista.push(m[1]); }
    else { lista = null; ut.push(rad); }
  }
  return ut.map(x => Array.isArray(x) ? `<ul>${x.map(li => `<li>${esc(li)}</li>`).join('')}</ul>` : esc(x)).join('\n').replace(/\n(<ul>)/g, '$1').replace(/(<\/ul>)\n/g, '$1');
}
function uppgiftRad(o, u, i) {
  return `<div class="task ${u.klar ? 'done' : ''}">
    <input type="checkbox" ${u.klar ? 'checked' : ''} onchange="toggleUppgift('${o.id}','${u.id}')">
    <div class="t"><div class="txt" onclick="dlgUppgift('${o.id}','${u.id}')" title="Klicka för att skriva en anteckning">${esc(u.text)}</div>
      ${u.anteckning ? `<div class="note" onclick="dlgUppgift('${o.id}','${u.id}')">${anteckningHtml(u.anteckning)}</div>` : ''}
      <div class="who">Ansvarig:${uppAnsv(u).map(pid => `<span class="chip">${esc(namn(pid))}<span class="x" title="Ta bort som ansvarig" onclick="taBortUppAnsv('${o.id}','${u.id}','${pid}')">✕</span></span>`).join('')}
        <select onchange="laggTillUppAnsv('${o.id}','${u.id}',this.value)" style="width:auto">
          <option value="">${uppAnsv(u).length ? '+ fler' : 'ingen, välj…'}</option>
          ${state.personer.filter(p => !uppAnsv(u).includes(p.id)).map(p => `<option value="${p.id}">${esc(p.namn)}</option>`).join('')}
        </select></div></div>
    <div class="ops">
      <button class="iconbtn" title="Flytta upp" onclick="flyttaUppgift('${o.id}',${i},-1)" ${i === 0 ? 'disabled' : ''}>↑</button>
      <button class="iconbtn" title="Flytta ner" onclick="flyttaUppgift('${o.id}',${i},1)" ${i === o.uppgifter.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="iconbtn" title="Redigera" onclick="dlgUppgift('${o.id}','${u.id}')">✎</button>
      <button class="iconbtn danger" title="Ta bort" onclick="taBortUppgift('${o.id}','${u.id}')">🗑</button>
    </div></div>`;
}

function passKort(p, visaOmrade) {
  const k = krockar(p);
  return `<div class="pass ${k.length ? 'conflict' : ''}" onclick="${p.bana ? `go('banschema',{dag:'${p.dag}'})` : `dlgPass('${p.omrade.id}','${p.schema.id}','${p.id}')`}">
    ${visaOmrade ? `<div class="omr">${esc(p.omrade.namn)} · ${esc(p.schema.namn)}</div>` : ''}
    <div class="time">${esc(passTid(p))}</div>
    <div class="ppl ${p.personer.length ? '' : 'none'}">${p.personer.length ? p.personer.map(namn).map(esc).join(', ') : 'Ingen tillsatt'}</div>
    ${p.anteckning ? `<div class="note">${esc(p.anteckning)}</div>` : ''}
    ${k.length ? `<div class="dup">⚠ Dubbelbokad: ${k.map(namn).map(esc).join(', ')}</div>` : ''}
  </div>`;
}

function schemaBlock(o, sc) {
  const dagar = [...sc.dagar].sort(sortDag);
  return `<div class="schema">
    <div class="head"><h3>${esc(sc.namn)}</h3><span class="days">${dagar.map(d => dag(d)?.kort).join(' · ')}</span>
      <span class="right"><button class="iconbtn" title="Redigera schema" onclick="dlgSchema('${o.id}','${sc.id}')">✎</button>
      <button class="iconbtn danger" title="Ta bort schema" onclick="taBortSchema('${o.id}','${sc.id}')">🗑</button></span></div>
    <div class="daycols">${dagar.map(d => {
      const pass = sc.pass.filter(p => p.dag === d).sort(passOrdning).map(p => ({ ...p, omrade: o, schema: sc }));
      return `<div class="daycol"><h4>${esc(dag(d)?.label)}</h4>${pass.map(p => passKort(p)).join('')}
        <button class="addpass" onclick="dlgPass('${o.id}','${sc.id}',null,'${d}')">+ Pass</button></div>`;
    }).join('')}</div></div>`;
}

let schemaTab = 'dag';
function vySchema() {
  const pass = allaPass();
  const dagarMedPass = new Set(pass.map(p => p.dag));
  const dagar = DAGAR_ALLA.filter(d => state.tavling.dagar.includes(d.id) || dagarMedPass.has(d.id));
  let h = `<div class="topbar"><div><h1>Schema</h1><div class="sub">Alla pass i alla områden. Klicka på ett pass för att ändra det.</div></div>
    <div class="actions"><button class="btn" onclick="window.print()">Skriv ut</button></div></div>
    <div class="tabs">
      <button class="${schemaTab === 'dag' ? 'active' : ''}" onclick="schemaTab='dag';render()">Per dag</button>
      <button class="${schemaTab === 'person' ? 'active' : ''}" onclick="schemaTab='person';render()">Per person</button>
      <button class="${schemaTab === 'lediga' ? 'active' : ''}" onclick="schemaTab='lediga';render()">Obemannade pass</button>
    </div>`;
  if (!pass.length) return h + `<div class="empty">Inga pass ännu. Gå in på ett område och skapa ett schema.</div>`;

  if (schemaTab === 'dag') {
    for (const d of dagar) {
      const pd = pass.filter(p => p.dag === d.id).sort((a, b) => a.omrade.namn.localeCompare(b.omrade.namn, 'sv') || passOrdning(a, b));
      h += `<div class="section-head"><h2>${esc(d.label)}</h2><div class="line"></div><span class="hint">${pd.length} pass</span></div>`;
      if (!pd.length) { h += `<div class="empty">Inga pass.</div>`; continue; }
      const perOmr = {};
      for (const p of pd) (perOmr[p.omrade.id] ||= []).push(p);
      h += `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">`;
      for (const [oid, ps] of Object.entries(perOmr)) {
        const bana = oid === 'banschema';
        h += `<div class="card" style="padding:12px 14px"><h3 style="font-size:15px;cursor:pointer" onclick="${bana ? `go('banschema',{dag:'${d.id}'})` : `go('omrade',{id:'${oid}'})`}">${esc(ps[0].omrade.namn)}</h3>
          ${ps.map(p => passKort(p)).join('')}</div>`;
      }
      h += `</div>`;
    }
  } else if (schemaTab === 'person') {
    const pers = [...state.personer].sort((a, b) => a.namn.localeCompare(b.namn, 'sv'));
    h += `<table><thead><tr><th>Person</th>${dagar.map(d => `<th>${esc(d.kort)}</th>`).join('')}<th>Pass</th></tr></thead><tbody>`;
    for (const p of pers) {
      const mina = pass.filter(x => x.personer.includes(p.id));
      h += `<tr><td style="white-space:nowrap"><span class="avatar">${esc(initialer(p.namn))}</span> ${esc(p.namn)}</td>`;
      for (const d of dagar) {
        const pd = mina.filter(x => x.dag === d.id).sort(passOrdning);
        h += `<td>${pd.map(x => `<div class="pass ${krockar(x).length ? 'conflict' : ''}" style="margin-bottom:4px" onclick="${x.bana ? `go('banschema',{dag:'${x.dag}'})` : `dlgPass('${x.omrade.id}','${x.schema.id}','${x.id}')`}"><div class="time">${esc(passTid(x))}</div><div class="omr">${esc(x.omrade.namn)}${x.bana && x.anteckning ? ` · ${esc(x.anteckning)}` : ''}</div></div>`).join('') || '<span class="hint">–</span>'}</td>`;
      }
      h += `<td>${mina.length}</td></tr>`;
    }
    h += `</tbody></table>`;
    const utan = pass.filter(p => !p.personer.length).length;
    if (utan) h += `<p class="hint" style="margin-top:12px">${utan} pass saknar personer. Se fliken Obemannade pass.</p>`;
  } else {
    const lediga = pass.filter(p => !p.personer.length).sort((a, b) => sortDag(a.dag, b.dag) || passOrdning(a, b));
    if (!lediga.length) h += `<div class="empty">Alla pass har någon tillsatt. 🎉</div>`;
    else h += `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${lediga.map(p => `<div>${passKort(p, true)}<div class="hint" style="margin:-2px 0 8px 4px">${esc(dag(p.dag)?.label)}</div></div>`).join('')}</div>`;
  }
  return h;
}

/* ============ Klasser ============ */
const KLASS_FALT = [
  // [nyckel, rubrik, typ, placeholder]
  ['avd', 'Avd', 'text', 'A eller B'],
  ['niva', 'Nivå', 'text', '1–4'],
  ['hojd', 'Höjd (cm)', 'text', '120'],
  ['bedomning', 'Bedömning', 'text', 'A, A:0, A+A:0 med totalfel …'],
  ['prispeng', 'Prispengar', 'text', '1500, 1000, 800, 600, 400 till plac'],
  ['info', 'Info', 'text', 'Bukett …'],
  ['avgift', 'Avgift (kr)', 'number', '260'],
  ['eavgift', 'Efteranmälningsavgift (kr)', 'number', '50'],
  ['antalPlacerade', 'Antal placerade', 'number', ''],
  ['utgiftVinster', 'Utgift vinster (kr)', 'number', ''],
  ['startavgifter', 'Startavgifter (kr)', 'number', ''],
  ['sponsor', 'Sponsor', 'text', 'Vem sponsrar klassen'],
];
const KLASS_JA = [['rosett', 'Rosett'], ['avgTillbaka', 'Avgift tillbaka'], ['hederspris', 'Hederspris']];
const klassNamn = k => `Klass ${k.nr}`;
const klassKort = k => `Klass ${k.nr}${k.hojd ? ` · ${k.hojd} cm` : ''}${k.avd ? ` · Avd ${k.avd}` : ''}`;
const klassById = id => (state.klasser || []).find(k => k.id === id);
const klassOrdning = (a, b) => sortDag(a.dag, b.dag) || (parseFloat(a.nr) || 0) - (parseFloat(b.nr) || 0) || String(a.nr).localeCompare(String(b.nr), 'sv');
const kr = v => (v === '' || v == null) ? '' : Number(v).toLocaleString('sv-SE');

function vyKlasser() {
  const klasser = [...(state.klasser || [])].sort(klassOrdning);
  let h = `<div class="topbar"><div><h1>Klasser</h1><div class="sub">${klasser.length ? `${klasser.length} klasser` : 'Inga klasser inlagda ännu'} · klasserna går att välja på pass i schemat</div></div>
    <div class="actions"><button class="btn" onclick="window.print()">Skriv ut</button><button class="btn primary" onclick="dlgKlass()">+ Ny klass</button></div></div>`;
  if (!klasser.length) h += `<div class="empty">Lägg in tävlingens klasser här: dag, nummer, avdelning, nivå, höjd, bedömning, rosett, hederspris, prispengar, avgifter och sponsor. Sedan kan du välja klass när du lägger pass i ett schema.</div>`;
  const dagar = [...new Set(klasser.map(k => k.dag))].sort(sortDag);
  for (const d of dagar) {
    const kd = klasser.filter(k => k.dag === d);
    h += `<div class="section-head"><h2>${esc(dag(d)?.label || d)}</h2><div class="line"></div><span class="hint">${kd.length} klasser</span></div>
      <div class="block" style="padding:0;overflow:auto"><table class="klasstabell"><thead><tr>
        <th>Klass</th><th>Avd</th><th>Höjd</th><th>Bedömning</th><th></th>
      </tr></thead><tbody>`;
    for (const k of kd) {
      h += `<tr onclick="dlgKlass('${k.id}')" style="cursor:pointer" title="Klicka för att se och ändra alla uppgifter om klassen">
        <td><b>Klass ${esc(k.nr)}</b></td><td>${esc(k.avd)}</td><td>${k.hojd ? esc(k.hojd) + ' cm' : ''}</td><td>${esc(k.bedomning)}</td>
        <td style="white-space:nowrap" onclick="event.stopPropagation()"><span class="ops"><button class="iconbtn" title="Redigera" onclick="dlgKlass('${k.id}')">✎</button><button class="iconbtn danger" title="Ta bort" onclick="taBortKlass('${k.id}')">🗑</button></span></td></tr>`;
    }
    h += `</tbody></table></div>`;
  }
  h += `<div class="block" style="margin-top:24px"><h2>Ändringslogg <span class="hint" style="font-weight:400">klasser som lagts till, ändrats eller tagits bort</span></h2>${loggLista((state.logg || []).filter(r => r.typ === 'klass'), 'klasser', false)}</div>`;
  return h;
}
function nastaKlassNr() { const n = (state.klasser || []).map(k => parseFloat(k.nr)).filter(x => !isNaN(x)); return n.length ? Math.max(...n) + 1 : 1; }
function dlgKlass(kid) {
  const k = kid ? klassById(kid) : null;
  const dagar = DAGAR_ALLA.filter(d => state.tavling.dagar.includes(d.id) || d.id === k?.dag);
  const dagDefault = k?.dag || [...(state.klasser || [])].sort(klassOrdning).at(-1)?.dag || dagar[0]?.id;
  openDlg(`<h2>${k ? 'Klass ' + esc(k.nr) : 'Ny klass'}</h2>
    <div class="two" style="gap:12px">
      <div><label class="f">Dag</label><select name="dag">${dagar.map(d => `<option value="${d.id}" ${dagDefault === d.id ? 'selected' : ''}>${esc(d.label)}</option>`).join('')}</select></div>
      <div><label class="f">Klassnummer</label><input type="text" name="nr" value="${esc(k ? k.nr : nastaKlassNr())}" required></div>
    </div>
    <div class="two" style="gap:12px">${KLASS_FALT.map(([n, rub, typ, ph]) => `<div><label class="f">${esc(rub)}</label><input type="${typ}" name="${n}" value="${esc(k?.[n] ?? '')}" placeholder="${esc(ph)}" ${typ === 'number' ? 'min="0" step="1"' : ''}></div>`).join('')}</div>
    <label class="f">Gäller för klassen</label>
    <div class="chips">${KLASS_JA.map(([n, rub]) => `<label class="chip pick ${k?.[n] ? 'on' : ''}"><input type="checkbox" name="${n}" ${k?.[n] ? 'checked' : ''} style="display:none" onchange="this.parentElement.classList.toggle('on',this.checked)">${esc(rub)}</label>`).join('')}</div>
    <label class="f">Anteckning</label><textarea name="anteckning" rows="3">${esc(k?.anteckning)}</textarea>
    ${foot(k ? `<button type="button" class="btn danger" onclick="taBortKlass('${k.id}')">Ta bort klass</button>` : '')}`,
    f => {
      const nr = f.nr.value.trim(); if (!nr) return false;
      const d = { dag: f.dag.value, nr, anteckning: f.anteckning.value.trim() };
      for (const [n, , typ] of KLASS_FALT) d[n] = typ === 'number' ? (f[n].value === '' ? '' : Number(f[n].value)) : f[n].value.trim();
      for (const [n] of KLASS_JA) d[n] = f[n].checked;
      const krock = (state.klasser || []).find(x => x !== k && String(x.nr) === nr);
      if (krock && !confirm(`Det finns redan en Klass ${nr} (${dag(krock.dag)?.label}). Lägga in en till med samma nummer?`)) return false;
      if (k) {
        const andr = Object.keys(d).filter(n => JSON.stringify(d[n]) !== JSON.stringify(k[n] ?? (typeof d[n] === 'boolean' ? false : '')));
        Object.assign(k, d);
        if (andr.length) logga(null, `ändrade ${klassNamn(k)} (${andr.map(n => ({ dag: 'dag', nr: 'nummer', anteckning: 'anteckning', ...Object.fromEntries(KLASS_FALT.map(([x, r]) => [x, r.toLowerCase()])), ...Object.fromEntries(KLASS_JA.map(([x, r]) => [x, r.toLowerCase()])) }[n] || n)).join(', ')})`, 'klass');
      } else { state.klasser ||= []; state.klasser.push({ id: uid(), ...d }); logga(null, `lade till ${klassNamn(d)} (${dag(d.dag)?.label}${d.hojd ? `, ${d.hojd} cm` : ''}${d.avd ? `, avd ${d.avd}` : ''})`, 'klass'); }
      save(); render();
    }, true);
}
function taBortKlass(kid) {
  const k = klassById(kid);
  const pass = allaPass().filter(p => p.klassId === kid).length;
  if (!confirm(`Ta bort ${klassNamn(k)} (${dag(k.dag)?.label})?${pass ? ` ${pass} pass i schemat pekar på den; de behåller texten men tappar kopplingen.` : ''}`)) return;
  state.klasser = state.klasser.filter(x => x.id !== kid);
  for (const o of state.omraden) for (const sc of o.scheman) for (const p of sc.pass) if (p.klassId === kid) delete p.klassId;
  logga(null, `tog bort ${klassNamn(k)} (${dag(k.dag)?.label})`, 'klass');
  if (dlg.open) dlg.close(); save(); render();
}

/* ============ Banschema ============ */
const BANROLLER = [['banchef', 'Banchef'], ['inslapp', 'Insläpp'], ['utslapp', 'Utsläpp']];
const banaKategori = () => state.sektioner.find(s => s.bana);
const banradById = id => (state.banrader || []).find(r => r.id === id);
const banraderFor = d => (state.banrader || []).filter(r => r.dag === d).sort((a, b) => (a.ordning ?? 0) - (b.ordning ?? 0));
const banRadText = r => r.typ === 'klass' ? (klassById(r.klassId) ? klassKort(klassById(r.klassId)) : (r.text || 'Klass')) : r.typ === 'ombyggnad' ? 'Ombyggnad' : (r.text || 'Annat');
function banObemannade() { let n = 0; for (const r of (state.banrader || [])) { if (r.typ === 'klass') { for (const [f] of BANROLLER) if (!r[f]) n++; if (!(r.banpersonal || []).length) n++; } else if (!(r.personer || []).length) n++; } return n; }
function loggaBana(text) { const k = banaKategori(); state.logg ||= []; state.logg.push({ id: uid(), tid: new Date().toISOString(), vem: vem || 'Okänd', kategoriId: k ? k.id : null, omradeId: null, omrade: '', text, typ: 'bana' }); }
let banDag = null;

function vyBanschema() {
  const kat = banaKategori(); const dagar = dagarValda();
  if (route.dag) banDag = route.dag;
  if (!banDag || !state.tavling.dagar.includes(banDag)) banDag = dagar[0]?.id;
  const rader = banraderFor(banDag);
  const klasserDag = [...(state.klasser || [])].filter(k => k.dag === banDag).sort(klassOrdning);
  const saknas = banObemannade();
  let h = `<div class="topbar"><div>${kat ? `<div class="hint" style="cursor:pointer" onclick="go('sektion',{id:'${kat.id}'})">${esc(kat.namn)} ›</div>` : ''}<h1>Banschema</h1>
      <div class="sub">Klass för klass med banchef, insläpp, utsläpp och banpersonal, och ombyggnad emellan${saknas ? ` · ${saknas} roller saknar person` : ''}</div></div>
    <div class="actions"><button class="btn" onclick="window.print()">Skriv ut</button>
      <button class="btn" onclick="dlgBanrad('${banDag}','annat')">+ Annat</button>
      <button class="btn" onclick="banLaggTillRad('${banDag}','ombyggnad')">+ Ombyggnad</button>
      <button class="btn primary" onclick="dlgBanrad('${banDag}','klass')">+ Klass</button></div></div>`;
  h += `<div class="tabs">${dagar.map(d => `<button class="${d.id === banDag ? 'active' : ''}" onclick="banDag='${d.id}';render()">${esc(d.label)} <span class="hint">${banraderFor(d.id).filter(r => r.typ === 'klass').length}</span></button>`).join('')}</div>`;
  if (!rader.length) {
    h += `<div class="block"><div class="empty">Inget banschema för ${esc(dag(banDag)?.label.toLowerCase())} ännu.</div>
      ${klasserDag.length ? `<p class="hint">Det finns ${klasserDag.length} klasser inlagda för dagen under Klasser.</p><button class="btn" onclick="banFyll('${banDag}')">Fyll i från klasserna, med ombyggnad emellan</button>` : '<p class="hint">Lägg in dagens klasser under Klasser först, så kan schemat fyllas i automatiskt. Eller lägg till rader för hand med knapparna ovan.</p>'}</div>`;
    return h + banLogg();
  }
  const sel = (r, falt) => `<select class="${r[falt] ? '' : 'tom'}" onchange="banSatt('${r.id}','${falt}',this.value)"><option value="">${r[falt] ? 'ingen' : 'välj…'}</option>${state.personer.map(p => `<option value="${p.id}" ${r[falt] === p.id ? 'selected' : ''}>${esc(p.namn)}</option>`).join('')}</select>`;
  const multi = (r, falt) => { const lista = r[falt] || []; return `<div class="chips">${lista.map(pid => `<span class="chip">${esc(namn(pid))}<span class="x" title="Ta bort" onclick="banTaBortPerson('${r.id}','${falt}','${pid}')">✕</span></span>`).join('')}
    <select onchange="banLaggTillPerson('${r.id}','${falt}',this.value)" class="${lista.length ? '' : 'tom'}"><option value="">${lista.length ? '+ fler' : 'välj…'}</option>${state.personer.filter(p => !lista.includes(p.id)).map(p => `<option value="${p.id}">${esc(p.namn)}</option>`).join('')}</select></div>`; };
  const ops = (r, i) => `<td class="ops"><button class="iconbtn" title="Flytta upp" onclick="banFlytta('${r.id}',-1)" ${i === 0 ? 'disabled' : ''}>↑</button><button class="iconbtn" title="Flytta ner" onclick="banFlytta('${r.id}',1)" ${i === rader.length - 1 ? 'disabled' : ''}>↓</button>${r.typ === 'klass' ? `<button class="iconbtn" title="Lägg till ombyggnad efter" onclick="banLaggTillRad('${banDag}','ombyggnad','${r.id}')">⤵</button>` : ''}<button class="iconbtn" title="Redigera" onclick="dlgBanrad('${banDag}','${r.typ}','${r.id}')">✎</button><button class="iconbtn danger" title="Ta bort raden" onclick="banRadBort('${r.id}')">🗑</button></td>`;
  h += `<div class="block" style="padding:0;overflow:auto"><table class="bantabell"><thead><tr><th></th><th>Klass</th><th>Banchef</th><th>Insläpp</th><th>Utsläpp</th><th>Banpersonal</th><th></th></tr></thead><tbody>`;
  let n = 0;
  rader.forEach((r, i) => {
    if (r.typ === 'klass') {
      n++; const k = klassById(r.klassId);
      h += `<tr><td class="nr">${n}</td><td class="klass">${esc(k ? `Klass ${k.nr}` : (r.text || 'Klass'))}<small>${k ? esc([k.hojd ? k.hojd + ' cm' : '', k.avd ? 'Avd ' + k.avd : '', k.bedomning].filter(Boolean).join(' · ')) : ''}</small>${r.anteckning ? `<span class="note">${esc(r.anteckning)}</span>` : ''}</td>
        <td>${sel(r, 'banchef')}</td><td>${sel(r, 'inslapp')}</td><td>${sel(r, 'utslapp')}</td><td>${multi(r, 'banpersonal')}</td>${ops(r, i)}</tr>`;
    } else {
      h += `<tr class="${r.typ}"><td class="nr"></td><td class="klass">${esc(r.typ === 'ombyggnad' ? 'Ombyggnad' : (r.text || 'Annat'))}${r.anteckning ? `<span class="note">${esc(r.anteckning)}</span>` : ''}</td><td colspan="4">${multi(r, 'personer')}</td>${ops(r, i)}</tr>`;
    }
  });
  h += `</tbody></table></div>`;
  const oanvanda = klasserDag.filter(k => !rader.some(r => r.klassId === k.id));
  if (oanvanda.length) h += `<p class="hint">${oanvanda.length} ${oanvanda.length === 1 ? 'klass' : 'klasser'} för dagen finns inte i schemat än: ${esc(oanvanda.map(k => 'Klass ' + k.nr).join(', '))}. <a href="#" onclick="event.preventDefault();banFyll('${banDag}')">Lägg till dem</a>.</p>`;
  h += `<p class="hint">Tomma rutor är gula tills någon är tillsatt. Pilen ⤵ på en klass lägger in en ombyggnad direkt efter. Allt som fylls i här syns också i personvyn och bland obemannade pass under Schema.</p>`;
  return h + banLogg();
}
const banLogg = () => `<div class="block" style="margin-top:18px"><h2>Ändringslogg <span class="hint" style="font-weight:400">banschemat</span></h2>${loggLista((state.logg || []).filter(r => r.typ === 'bana'), 'bana', false)}</div>`;
function banOrdna(d) { banraderFor(d).forEach((r, i) => r.ordning = i); }
function banSatt(rid, falt, pid) {
  const r = banradById(rid); const fore = r[falt] || null; r[falt] = pid || null; if (fore === r[falt]) return;
  const roll = Object.fromEntries(BANROLLER)[falt];
  loggaBana(pid ? `${dag(r.dag)?.label} ${banRadText(r)}: satte ${namn(pid)} som ${roll.toLowerCase()}${fore ? ` (var ${namn(fore)})` : ''}` : `${dag(r.dag)?.label} ${banRadText(r)}: tog bort ${namn(fore)} som ${roll.toLowerCase()}`);

function toggleTavlingsdag(d) {
  const i = state.tavling.dagar.indexOf(d);
  if (i >= 0) { if (state.tavling.dagar.length === 1) return toast('Minst en dag måste vara vald'); state.tavling.dagar.splice(i, 1); }

function laggTillAnsvarig(oid, pid) {
  if (!pid) return;
  if (pid === '__ny') return dlgPerson(null, p => { omrById(oid).ansvariga.push(p.id); logga(oid, `satte ${p.namn} som ansvarig för området`); save(); render(); });

  omrById(oid).ansvariga.push(pid); logga(oid, `satte ${namn(pid)} som ansvarig för området`); save(); render();
}
document.addEventListener('click', e => {
  const r = e.target.closest('[data-remove]');
  if (r && route.view === 'omrade') { const o = omrById(route.id); o.ansvariga = o.ansvariga.filter(p => p !== r.dataset.remove); logga(o.id, `tog bort ${namn(r.dataset.remove)} som ansvarig för området`); save(); render(); }
});
function laggTillUppgift(oid, text) { text = text.trim(); if (!text) return; omrById(oid).uppgifter.push({ id: uid(), text, anteckning: '', ansvarig: null, klar: false }); logga(oid, `lade till uppgiften "${text}"`); save(); render(); }
function toggleUppgift(oid, uid_) { const u = omrById(oid).uppgifter.find(u => u.id === uid_); u.klar = !u.klar; logga(oid, `${u.klar ? 'bockade av' : 'öppnade igen'} uppgiften "${u.text}"`); save(); render(); }
// En uppgift kan ha flera ansvariga. Äldre uppgifter har ett enda "ansvarig"-fält; det läses som en lista.
function uppAnsv(u) { return u.ansvariga || (u.ansvarig ? [u.ansvarig] : []); }
function sattUppAnsv(u, lista) { u.ansvariga = lista; delete u.ansvarig; }
function laggTillUppAnsv(oid, uid_, pid) { if (!pid) return; const u = omrById(oid).uppgifter.find(u => u.id === uid_); if (uppAnsv(u).includes(pid)) return render(); sattUppAnsv(u, [...uppAnsv(u), pid]); logga(oid, `satte ${namn(pid)} som ansvarig för uppgiften "${u.text}"`); save(); render(); }
function taBortUppAnsv(oid, uid_, pid) { const u = omrById(oid).uppgifter.find(u => u.id === uid_); sattUppAnsv(u, uppAnsv(u).filter(x => x !== pid)); logga(oid, `tog bort ${namn(pid)} som ansvarig för uppgiften "${u.text}"`); save(); render(); }
function flyttaUppgift(oid, i, d) { const a = omrById(oid).uppgifter; const j = i + d; if (j < 0 || j >= a.length) return;[a[i], a[j]] = [a[j], a[i]]; save(); render(); }
function taBortUppgift(oid, uid_) { const o = omrById(oid); const u = o.uppgifter.find(u => u.id === uid_); if (!confirm(`Ta bort uppgiften "${u.text}"?`)) return; o.uppgifter = o.uppgifter.filter(u => u.id !== uid_); logga(oid, `tog bort uppgiften "${u.text}"`); save(); render(); }
function taBortOmrade(oid) { const o = omrById(oid); if (!confirm(`Ta bort området "${o.namn}" med ${o.uppgifter.length} uppgifter och ${o.scheman.length} scheman?`)) return; logga(oid, `tog bort området "${o.namn}" med ${o.uppgifter.length} uppgifter och ${o.scheman.length} scheman`); state.omraden = state.omraden.filter(x => x.id !== oid); save(); go('oversikt'); }
function taBortSektion(sid) {
  const s = sektById(sid); const os = omradenI(sid);
  if (os.length) { if (!confirm(`Kategorin "${s.namn}" har ${os.length} områden. Ta bort kategorin OCH alla områden i den?`)) return; state.omraden = state.omraden.filter(o => o.sektionId !== sid); }
  else if (!confirm(`Ta bort kategorin "${s.namn}"?`)) return;
  state.sektioner = state.sektioner.filter(x => x.id !== sid); logga(null, `tog bort kategorin "${s.namn}"${os.length ? ` med ${os.length} områden` : ''}`); save(); go('oversikt');
}
function taBortSchema(oid, sid) { const o = omrById(oid); const s = o.scheman.find(s => s.id === sid); if (!confirm(`Ta bort schemat "${s.namn}" med ${s.pass.length} pass?`)) return; o.scheman = o.scheman.filter(s => s.id !== sid); logga(oid, `tog bort schemat "${s.namn}" med ${s.pass.length} pass`); save(); render(); }
function taBortPerson(pid) {
  const p = personById(pid); if (!confirm(`Ta bort ${p.namn}? Personen tas bort från alla områden, uppgifter och pass.`)) return;
  state.personer = state.personer.filter(x => x.id !== pid);
  for (const o of state.omraden) {
    let rorde = o.ansvariga.includes(pid);
    o.ansvariga = o.ansvariga.filter(x => x !== pid);
    for (const u of o.uppgifter) if (uppAnsv(u).includes(pid)) { sattUppAnsv(u, uppAnsv(u).filter(x => x !== pid)); rorde = true; }
    for (const s of o.scheman) for (const ps of s.pass) if (ps.personer.includes(pid)) { ps.personer = ps.personer.filter(x => x !== pid); rorde = true; }
    if (rorde) logga(o.id, `tog bort personen ${p.namn} (plockades bort från områdets ansvariga, uppgifter och pass)`);
  }
  logga(null, `tog bort personen ${p.namn}`);
  save(); render();
}
function exportera() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `tavlingssektionen-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importera(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.omraden || !d.personer) throw 0; if (!confirm(sb ? 'Ersätta ALLT i databasen, för alla medlemmar, med innehållet i filen?' : 'Ersätta allt som finns här med innehållet i filen?')) return; mergeInPlace(state, d); save(); go('oversikt'); toast('Importerat'); } catch { alert('Filen gick inte att läsa. Är det en export från den här appen?'); } };
  r.readAsText(file);
}
function aterstall() { if (!confirm(sb ? 'Rensa ALLT i databasen, för alla medlemmar, och läs in grunddatat från Excel igen? Scheman, loggar och anslag försvinner.' : 'Rensa allt och läs in grunddatat från Excel igen?')) return; mergeInPlace(state, seedData()); save(); go('oversikt'); }

    </div>
    <div class="lage-tid">
      <div class="two" style="gap:12px"><div><label class="f">Börjar</label><input type="time" name="start" value="${esc(p?.start)}"></div><div><label class="f">Slutar</label><input type="time" name="slut" value="${esc(p?.slut)}"></div></div>
      <p class="hint" style="margin:6px 0 0">Lämna tiderna tomma för ett pass som gäller hela dagen.</p>
    </div>
    <div class="lage-klass" style="display:none">
      ${(state.klasser || []).length ? `<label class="f">Välj klass</label><select name="klassval" onchange="passValdKlass(this.form)">
        <option value="">Skriv själv…</option>
        ${[...state.klasser].sort(klassOrdning).map(k => `<option value="${k.id}" data-dag="${k.dag}" ${p?.klassId === k.id ? 'selected' : ''}>${esc(dag(k.dag)?.kort)} · ${esc(klassKort(k))}${k.bedomning ? ` · ${esc(k.bedomning)}` : ''}</option>`).join('')}
      </select>` : ''}
      <label class="f">Klass</label><input type="text" name="klass" value="${esc(p?.klass)}" data-forslag="${esc(nastaKlass(s, p?.dag || dagDefault || dagar[0]))}" placeholder="T.ex. Klass 1">
      <p class="hint" style="margin:6px 0 0">Ingen tid, bara turordning. Passen sorteras efter klassens nummer: Klass 1, Klass 2, Klass 3 … ${(state.klasser || []).length ? 'Välj ur listan så fylls texten i och passet kopplas till klassen.' : 'Lägger du in klasserna under Klasser kan du välja dem här i stället.'}</p>
    </div>
    <label class="f">Personer <span style="font-weight:400">(klicka för att välja)</span></label>${personPick(p?.personer || [])}
    <button type="button" class="btn small ghost" style="margin-top:6px" onclick="dlgPassNyPerson()">＋ Ny person</button>
    <label class="f">Anteckning</label><input type="text" name="anteckning" value="${esc(p?.anteckning)}" placeholder="T.ex. ta med hinderlista, nyckel till containern…">
    ${foot(p ? `<button type="button" class="btn danger" onclick="taBortPass('${oid}','${sid}','${pid}')">Ta bort pass</button>` : '')}`,
    f => {
      const klassLage = f.lage.value === 'klass';
      const start = klassLage ? '' : f.start.value, slut = klassLage ? '' : f.slut.value;
      const klass = klassLage ? f.klass.value.trim() : '';
      if (klassLage && !klass) { alert('Skriv vilken klass passet gäller, t.ex. Klass 1.'); return false; }
      if (start && slut && slut <= start) { alert('Sluttiden måste vara efter starttiden.'); return false; }
      const klassId = klassLage && f.klassval && f.klassval.value ? f.klassval.value : undefined;
      const d = { dag: f.dag.value, start, slut, klass, personer: checked(f, 'personer'), anteckning: f.anteckning.value.trim() };
      if (klassId) d.klassId = klassId; else if (p) delete p.klassId;
      if (p) {
        const andr = [];
        if (d.dag !== p.dag || d.start !== (p.start || '') || d.slut !== (p.slut || '') || d.klass !== (p.klass || '')) andr.push(`flyttade passet ${passText(p)} till ${passText(d)}`);
        const in_ = d.personer.filter(x => !p.personer.includes(x)), ut = p.personer.filter(x => !d.personer.includes(x));
        if (in_.length) andr.push(`satte ${namnLista(in_)} på passet ${passText(d)}`);
        if (ut.length) andr.push(`tog bort ${namnLista(ut)} från passet ${passText(d)}`);
        if (d.anteckning !== (p.anteckning || '')) andr.push(`ändrade anteckningen på passet ${passText(d)}`);
        Object.assign(p, d);
        if (andr.length) logga(oid, `${s.namn}: ` + andr.join(', '));
      } else { s.pass.push({ id: uid(), ...d }); logga(oid, `${s.namn}: skapade passet ${passText(d)} med ${namnLista(d.personer)}`); }
      save(); render();
    });
  dlg._pass = { oid, sid, pid, dagDefault };
  passLage(dlg.querySelector('form'));
}
function passValdKlass(f) {
  const k = klassById(f.klassval.value); if (!k) return;
  f.klass.value = klassKort(k);
  const opt = f.dag.querySelector(`option[value=${k.dag}]`); if (opt) f.dag.value = k.dag;
}
function passLage(f) {
  const klass = f.lage.value === 'klass';
  f.querySelector('.lage-tid').style.display = klass ? 'none' : '';
  f.querySelector('.lage-klass').style.display = klass ? '' : 'none';
  for (const r of f.querySelectorAll('input[name=lage]')) r.parentElement.classList.toggle('on', r.checked);
  if (klass && !f.klass.value) { if (f.klassval && f.klassval.value) passValdKlass(f); else f.klass.value = f.klass.dataset.forslag || 'Klass 1'; }
  if (klass) { f.klass.focus(); f.klass.select(); }
}
function dlgPassNyPerson() {
  // Spara det som redan fyllts i, öppna persondialogen och kom tillbaka med personen vald.
  const f = dlg.querySelector('form'); const ctx = dlg._pass;
  const snap = { dag: f.dag.value, lage: f.lage.value, klass: f.klass.value, start: f.start.value, slut: f.slut.value, personer: checked(f, 'personer'), anteckning: f.anteckning.value };
  dlg.close();
  dlgPerson(null, ny => {
    save();
    dlgPass(ctx.oid, ctx.sid, ctx.pid, snap.dag);
    const g = dlg.querySelector('form');
    g.dag.value = snap.dag; g.start.value = snap.start; g.slut.value = snap.slut; g.anteckning.value = snap.anteckning;
    g.querySelector(`input[name=lage][value=${snap.lage}]`).checked = true; g.klass.value = snap.klass; passLage(g);
    for (const cb of g.querySelectorAll('input[name=personer]')) { cb.checked = snap.personer.includes(cb.value) || cb.value === ny.id; cb.parentElement.classList.toggle('on', cb.checked); }
  });
}
function taBortPass(oid, sid, pid) {
  const s = omrById(oid).scheman.find(s => s.id === sid);
  if (!confirm('Ta bort passet?')) return;
  const p = s.pass.find(p => p.id === pid);
  s.pass = s.pass.filter(p => p.id !== pid); logga(oid, `${s.namn}: tog bort passet ${passText(p)}${p.personer.length ? ` (${namnLista(p.personer)})` : ''}`); dlg.close(); save(); render();
}

function dlgVem(forsta) {
  const namnen = [...new Set([...state.personer.map(p => p.namn), vem].filter(Boolean))].sort((a, b) => a.localeCompare(b, 'sv'));
  openDlg(`<h2>Vem är du?</h2>
    <p class="hint" style="margin-top:0">Namnet skrivs i ändringsloggen på allt du gör, så att alla ser vem som ändrat vad. Det sparas i den här webbläsaren tills du byter.</p>
    <div class="chips" style="margin-top:10px">${namnen.map(n => `<span class="chip pick ${n === vem ? 'on' : ''}" onclick="this.closest('form').namn.value='${esc(n).replace(/'/g, '&#39;')}';this.closest('form').requestSubmit()">${esc(n)}</span>`).join('')}</div>
    <label class="f">Eller skriv ett namn</label><input type="text" name="namn" value="${esc(vem)}" placeholder="Ditt namn">
    <div class="foot"><div class="r">${forsta ? '' : '<button type="button" class="btn" onclick="dlg.close()">Avbryt</button>'}<button class="btn primary">Det är jag</button></div></div>`,
    f => { const n = f.namn.value.trim(); if (!n) { alert('Skriv eller välj ett namn.'); return false; } sattVem(n); toast(`Hej ${n}!`); });
  if (forsta) dlg.addEventListener('cancel', e => e.preventDefault(), { once: false });
}

starta();
</script>
</body>
</html>
